<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务器井字棋</title>
  <link rel="stylesheet" href="../../styles/site.css">
</head>
<body>
  <main class="app">
    <section class="game-panel" aria-labelledby="game-title">
      <a class="back-link" href="../../">← 返回小游戏集合</a>
      <div class="title-row">
        <div>
          <p class="eyebrow">Server Tic-Tac-Toe Demo</p>
          <h1 id="game-title">服务器井字棋</h1>
        </div>
        <div class="best-score">
          <span>当前回合</span>
          <strong id="current-player">X</strong>
        </div>
      </div>

      <div class="stats" aria-label="游戏数据">
        <div>
          <span>X 胜</span>
          <strong id="x-score">0</strong>
        </div>
        <div>
          <span>O 胜</span>
          <strong id="o-score">0</strong>
        </div>
        <div>
          <span>平局</span>
          <strong id="draw-score">0</strong>
        </div>
      </div>

      <div id="tic-board" class="tic-board" role="grid" aria-label="井字棋棋盘"></div>

      <p id="message" class="message"></p>

      <div class="actions single-action">
        <button id="reset" class="primary-button" type="button">重新开局</button>
      </div>
    </section>
  </main>

  <script src="game-state.js"></script>
  <script src="game.js"></script>
</body>
</html>
